
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e54">
<title>Where We Belong</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e9edef;
  color: #111b21;
  min-height: 100vh;
}

header {
  background: #075e54;
  color: white;
  padding: 17px 20px;
}

h1 {
  margin: 0 0 5px;
  font-size: 23px;
  font-weight: 600;
}

header p {
  margin: 0;
  font-size: 13px;
  color: #d8f3eb;
}

main {
  max-width: 720px;
  margin: 18px auto;
  padding: 10px;
}

.panel {
  background: #fff;
  border: 1px solid #d8dfe3;
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 2px 5px #0000000b;
}

h2 {
  font-size: 19px;
  font-weight: 600;
}

input, button {
  font: inherit;
  border-radius: 7px;
  padding: 13px;
  width: 100%;
  margin-top: 10px;
}

input {
  border: 1px solid #d1d7db;
  background: #fff;
  color: #111b21;
}

input:focus {
  outline: 2px solid #a4d9cb;
  border-color: #008f75;
}

button {
  border: none;
  background: #008f75;
  color: white;
  cursor: pointer;
  font-weight: 600;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.small {
  font-size: 12px;
  color: #667781;
  text-align: center;
}

#chat { display: none; }

#chatHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

#chatHeader h2 { margin: 0 0 6px; }

#chatHeader .small {
  text-align: left;
  margin: 0;
}

#logout {
  width: auto;
  margin: 0;
  padding: 10px 12px;
  background: #e9edef;
  color: #37474f;
}

#status {
  text-align: center;
  color: #008f75;
  font-size: 12px;
  min-height: 18px;
  margin-top: 12px;
}

#messages {
  height: 55vh;
  min-height: 280px;
  max-height: 560px;
  overflow-y: auto;
  padding: 12px;
  margin-top: 8px;
  background: #f7f9fa;
  border: 1px solid #e3e8eb;
  border-radius: 7px;
}

.message {
  max-width: 90%;
  width: fit-content;
  padding: 10px 12px;
  margin: 9px 0;
  border-radius: 9px;
  background: #fff;
  border: 1px solid #e4e8eb;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 1px #00000008;
}

.mine {
  margin-left: auto;
  background: #d9fdd3;
  border-color: #d9fdd3;
}

.meta {
  font-size: 11px;
  color: #667781;
  margin-bottom: 5px;
}

.messageText {
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 15px;
}

.replyQuote {
  border-left: 3px solid #008f75;
  background: #e9edef;
  padding: 7px 9px;
  margin-bottom: 8px;
  border-radius: 4px;
  font-size: 12px;
  color: #44545c;
  overflow-wrap: anywhere;
}

.mine .replyQuote {
  background: #c6edc0;
}

.replyQuote strong {
  display: block;
  margin-bottom: 3px;
}

.messageActions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 7px;
}

.messageActions button {
  width: auto;
  margin: 0;
  padding: 5px 7px;
  border: 1px solid #dfe5e8;
  background: #fff;
  color: #33434a;
  border-radius: 15px;
  font-size: 13px;
  font-weight: normal;
}

.messageActions button:hover {
  background: #e6f4ef;
}

.messageActions button.selectedReaction {
  background: #c8f2df;
  border-color: #008f75;
}

.messageActions .replyButton {
  font-size: 12px;
  padding: 6px 9px;
}

#typingStatus {
  min-height: 17px;
  font-size: 12px;
  color: #008f75;
  padding: 4px 2px;
}

#replyPreview {
  display: none;
  background: #e5f4ed;
  border-left: 4px solid #008f75;
  padding: 9px 10px;
  margin: 7px 0;
  border-radius: 5px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

#replyPreviewText {
  font-size: 12px;
  overflow-wrap: anywhere;
  min-width: 0;
}

#cancelReply {
  width: auto;
  flex-shrink: 0;
  margin: 0;
  padding: 6px 10px;
  background: #d4e5dd;
  color: #263b33;
  font-size: 12px;
}

#sendRow {
  display: flex;
  gap: 8px;
  align-items: center;
}

#messageInput {
  flex: 1;
  min-width: 0;
  border-radius: 24px;
  padding: 12px 15px;
}

#sendButton {
  width: 78px;
  flex-shrink: 0;
  border-radius: 24px;
}

#chatStatus {
  min-height: 16px;
}

footer {
  text-align: center;
  padding: 12px;
  font-size: 12px;
  color: #667781;
}

@media (max-width: 480px) {
  header { padding: 15px; }
  h1 { font-size: 21px; }

  main {
    margin: 7px auto;
    padding: 7px;
  }

  .panel { padding: 12px; }

  #messages {
    height: 56vh;
    min-height: 260px;
  }

  .message { max-width: 95%; }
}
</style>
</head>

<body>
<header>
  <h1>Where We Belong</h1>
  <p>Just us, one message at a time.</p>
</header>

<main>
  <section class="panel" id="login">
    <h2 style="text-align:center">Welcome back</h2>
    <p class="small">Sign in to enter your private chat.</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Email address"
        autocomplete="username" required>

      <input id="password" type="password"
        placeholder="Password"
        autocomplete="current-password" required>

      <button id="loginButton" type="submit">Log in</button>
    </form>

    <p id="loginStatus" class="small" role="status"></p>
  </section>

  <section class="panel" id="chat">
    <div id="chatHeader">
      <div>
        <h2>Our conversation</h2>
        <p class="small" id="partnerStatus">Checking connection...</p>
      </div>
      <button id="logout" type="button">Log out</button>
    </div>

    <div id="status" role="status"></div>
    <div id="messages" aria-live="polite"></div>
    <div id="typingStatus"></div>

    <div id="replyPreview">
      <div id="replyPreviewText"></div>
      <button id="cancelReply" type="button">Cancel</button>
    </div>

    <form id="sendForm">
      <div id="sendRow">
        <input id="messageInput"
          placeholder="Write a message..."
          maxlength="2000"
          autocomplete="off"
          required>
        <button id="sendButton" type="submit">Send</button>
      </div>
    </form>

    <p id="chatStatus" class="small" role="status"></p>
  </section>
</main>

<footer>Where We Belong</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBpa8Mr_4qdt7ETUti0I0wZDS0OW-EZ1884",
  authDomain: "where-we-belong-b25b1.firebaseapp.com",
  databaseURL: "https://where-we-belong-b25b1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "where-we-belong-b25b1",
  storageBucket: "where-we-belong-b25b1.firebasestorage.app",
  messagingSenderId: "803513103263",
  appId: "1:803513103263:web:4252a04ddbbd6d1ac1c3aa",
  measurementId: "G-5QSSTNZQ7H"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const allowedUsers = [
  "THUCBdlzXdf24tJglhi8jYSVFaR2",
  "ZFepStVL7uMwTi6zrOP8tx3Oyuh1"
];

const loginPanel = document.getElementById("login");
const chatPanel = document.getElementById("chat");
const loginStatus = document.getElementById("loginStatus");
const chatStatus = document.getElementById("chatStatus");
const messagesBox = document.getElementById("messages");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const connectionStatus = document.getElementById("status");
const partnerStatus = document.getElementById("partnerStatus");
const typingStatus = document.getElementById("typingStatus");
const replyPreview = document.getElementById("replyPreview");
const replyPreviewText = document.getElementById("replyPreviewText");

const reactionEmojis = ["❤️", "😂", "😍", "😮", "👍"];

let messagesRef = null;
let messagesListener = null;
let partnerRef = null;
let partnerListener = null;
let typingRef = null;
let typingListener = null;
let myTypingRef = null;
let presenceRef = null;
let connectedRef = null;
let connectedListener = null;
let typingTimer = null;
let currentUid = null;
let replyingTo = null;

function getPartnerUid() {
  return allowedUsers.find(uid => uid !== currentUid);
}

function showLogin(message = "") {
  loginPanel.style.display = "block";
  chatPanel.style.display = "none";
  loginStatus.textContent = message;
}

function showChat() {
  loginPanel.style.display = "none";
  chatPanel.style.display = "block";
  startChatFeatures();
}

function stopListener(ref, event, callback) {
  if (ref && callback) {
    ref.off(event, callback);
  }
}

function clearReply() {
  replyingTo = null;
  replyPreview.style.display = "none";
  replyPreviewText.textContent = "";
}

function stopChatFeatures() {
  stopListener(messagesRef, "value", messagesListener);
  stopListener(partnerRef, "value", partnerListener);
  stopListener(typingRef, "value", typingListener);
  stopListener(connectedRef, "value", connectedListener);

  if (typingTimer) clearTimeout(typingTimer);

  if (myTypingRef) {
    myTypingRef.remove().catch(() => {});
  }

  if (presenceRef) {
    presenceRef.onDisconnect().cancel().catch(() => {});
    presenceRef.remove().catch(() => {});
  }

  messagesRef = null;
  messagesListener = null;
  partnerRef = null;
  partnerListener = null;
  typingRef = null;
  typingListener = null;
  myTypingRef = null;
  presenceRef = null;
  connectedRef = null;
  connectedListener = null;
  typingTimer = null;
  currentUid = null;

  clearReply();
  messagesBox.replaceChildren();
  typingStatus.textContent = "";
  partnerStatus.textContent = "";
  messageInput.value = "";
}

function startPresence() {
  presenceRef = db.ref("status/" + currentUid);
  connectedRef = db.ref(".info/connected");

  connectedListener = snapshot => {
    if (snapshot.val() !== true || !auth.currentUser) return;

    presenceRef.onDisconnect().set({
      online: false,
      lastSeen: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      return presenceRef.set({
        online: true,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
      });
    }).catch(error => console.error(error));
  };

  connectedRef.on("value", connectedListener);
}

function startPartnerStatus() {
  const partnerUid = getPartnerUid();
  partnerRef = db.ref("status/" + partnerUid);

  partnerListener = snapshot => {
    const data = snapshot.val();

    partnerStatus.textContent =
      data && data.online === true ? "Online" : "Offline";
  };

  partnerRef.on("value", partnerListener);
}

function startTypingIndicator() {
  const partnerUid = getPartnerUid();

  myTypingRef = db.ref("typing/" + currentUid);
  typingRef = db.ref("typing/" + partnerUid);

  typingListener = snapshot => {
    typingStatus.textContent =
      snapshot.val() === true ? "Typing..." : "";
  };

  typingRef.on("value", typingListener);
}

function handleTyping() {
  if (!myTypingRef || !auth.currentUser) return;

  myTypingRef.set(messageInput.value.trim().length > 0)
    .catch(error => console.error(error));

  if (typingTimer) clearTimeout(typingTimer);

  typingTimer = setTimeout(() => {
    if (myTypingRef) {
      myTypingRef.set(false).catch(() => {});
    }
  }, 1500);
}

messageInput.addEventListener("input", handleTyping);

function makeButton(label, className, action, key, emoji = "") {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = label;
  button.className = className;
  button.dataset.action = action;
  button.dataset.key = key;

  if (emoji) button.dataset.emoji = emoji;

  return button;
}

function renderMessage(key, message) {
  const bubble = document.createElement("div");
  bubble.className = "message" +
    (message.senderUid === currentUid ? " mine" : "");

  const meta = document.createElement("div");
  meta.className = "meta";

  const timestamp = Number(message.createdAt);
  const dateText = Number.isFinite(timestamp) && timestamp > 0
    ? new Date(timestamp).toLocaleString()
    : "Just now";

  meta.textContent =
    (message.senderUid === currentUid ? "You" : "Partner")
    + " · " + dateText;

  bubble.appendChild(meta);

  if (message.replyTo && typeof message.replyTo.text === "string") {
    const quote = document.createElement("div");
    quote.className = "replyQuote";

    const quoteSender = document.createElement("strong");
    quoteSender.textContent =
      message.replyTo.senderUid === currentUid ? "You" : "Partner";

    const quoteText = document.createElement("div");
    quoteText.textContent = message.replyTo.text;

    quote.append(quoteSender, quoteText);
    bubble.appendChild(quote);
  }

  const content = document.createElement("div");
  content.className = "messageText";
  content.textContent = message.text;
  bubble.appendChild(content);

  const actions = document.createElement("div");
  actions.className = "messageActions";

  const reactions = message.reactions || {};

  reactionEmojis.forEach(emoji => {
    const count = Object.values(reactions)
      .filter(value => value === emoji).length;

    const mine = reactions[currentUid] === emoji;
    const label = emoji + (count > 0 ? " " + count : "");

    const button = makeButton(
      label,
      mine ? "selectedReaction" : "",
      "react",
      key,
      emoji
    );

    button.setAttribute("aria-label", "React with " + emoji);
    actions.appendChild(button);
  });

  const replyButton = makeButton(
    "↩ Reply",
    "replyButton",
    "reply",
    key
  );

  actions.appendChild(replyButton);
  bubble.appendChild(actions);

  return bubble;
}

function startMessages() {
  stopListener(messagesRef, "value", messagesListener);

  messagesBox.replaceChildren();
  messagesRef = db.ref("messages").limitToLast(100);

  messagesListener = snapshot => {
    messagesBox.replaceChildren();

    snapshot.forEach(child => {
      const message = child.val();

      if (!message || typeof message.text !== "string") return;

      messagesBox.appendChild(renderMessage(child.key, message));
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;
    connectionStatus.textContent = "Connected";
  };

  messagesRef.on("value", messagesListener, error => {
    connectionStatus.textContent =
      "Could not load messages. Check database rules.";
    console.error(error);
  });
}

messagesBox.addEventListener("click", async event => {
  const button = event.target.closest("button[data-action]");
  if (!button || !currentUid || !auth.currentUser) return;

  const key = button.dataset.key;
  const action = button.dataset.action;

  if (!key) return;

  if (action === "reply") {
    const snapshot = await db.ref("messages/" + key).get();
    const message = snapshot.val();

    if (!message || typeof message.text !== "string") {
      chatStatus.textContent = "This message is no longer available.";
      return;
    }

    replyingTo = {
      key: key,
      text: message.text,
      senderUid: message.senderUid || ""
    };

    replyPreviewText.textContent =
      "Replying to " +
      (message.senderUid === currentUid ? "your message: " : "partner: ") +
      message.text;

    replyPreview.style.display = "flex";
    messageInput.focus();
    return;
  }

  if (action === "react") {
    const emoji = button.dataset.emoji;
    if (!reactionEmojis.includes(emoji)) return;

    const reactionRef = db.ref(
      "messages/" + key + "/reactions/" + currentUid
    );

    try {
      const snapshot = await reactionRef.get();

      if (snapshot.val() === emoji) {
        await reactionRef.remove();
      } else {
        await reactionRef.set(emoji);
      }

      chatStatus.textContent = "";
    } catch (error) {
      chatStatus.textContent = "Reaction not saved. Please try again.";
      console.error(error);
    }
  }
});

document.getElementById("cancelReply").addEventListener(
  "click", clearReply
);

function startChatFeatures() {
  if (!auth.currentUser ||
      !allowedUsers.includes(auth.currentUser.uid)) return;

  stopChatFeatures();
  currentUid = auth.currentUser.uid;

  connectionStatus.textContent = "Connecting...";
  chatStatus.textContent = "";

  startMessages();
  startPresence();
  startPartnerStatus();
  startTypingIndicator();
}

document.getElementById("loginForm").addEventListener(
  "submit", async event => {
    event.preventDefault();

    const loginButton = document.getElementById("loginButton");
    loginButton.disabled = true;
    loginStatus.textContent = "Signing in...";

    try {
      const result = await auth.signInWithEmailAndPassword(
        document.getElementById("email").value.trim(),
        document.getElementById("password").value
      );

      if (!allowedUsers.includes(result.user.uid)) {
        await auth.signOut();
        loginStatus.textContent = "This account is not allowed.";
      }
    } catch (error) {
      loginStatus.textContent =
        "Could not sign in. Check your email and password.";
      console.error(error);
    } finally {
      loginButton.disabled = false;
    }
  }
);

document.getElementById("sendForm").addEventListener(
  "submit", async event => {
    event.preventDefault();

    const text = messageInput.value.trim();

    if (!text || !auth.currentUser ||
        !allowedUsers.includes(auth.currentUser.uid)) return;

    sendButton.disabled = true;
    chatStatus.textContent = "";

    const newMessage = {
      text: text,
      senderUid: auth.currentUser.uid,
      createdAt: firebase.database.ServerValue.TIMESTAMP
    };

    if (replyingTo) {
      newMessage.replyTo = {
        key: replyingTo.key,
        text: replyingTo.text,
        senderUid: replyingTo.senderUid
      };
    }

    try {
      await db.ref("messages").push(newMessage);

      messageInput.value = "";
      clearReply();

      if (myTypingRef) {
        await myTypingRef.set(false);
      }

      messageInput.focus();
    } catch (error) {
      chatStatus.textContent =
        "Message not sent. Please try again.";
      console.error(error);
    } finally {
      sendButton.disabled = false;
    }
  }
);

document.getElementById("logout").addEventListener(
  "click", async () => {
    stopChatFeatures();
    await auth.signOut();
  }
);

auth.onAuthStateChanged(user => {
  if (user && allowedUsers.includes(user.uid)) {
    showChat();
  } else {
    stopChatFeatures();

    if (user) {
      auth.signOut();
    }

    showLogin();
  }
});

window.addEventListener("beforeunload", () => {
  if (myTypingRef) myTypingRef.remove();
});
</script>
</body>
</html>
