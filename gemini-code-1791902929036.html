<div id="replyPreview">  
      <span id="replyPreviewUser">Replying</span>  
      <p id="replyPreviewText" style="margin:2px 0 0; font-size:12px; color:#333;"></p>  
      <button id="cancelReply" type="button">&times;</button>  
    </div>  

    <form id="sendForm">  
      <div id="sendRow">  
        <button type="button" id="fileButton" title="Send Photo">📷</button>  
        <input type="file" id="fileInput" accept="image/*" style="display:none;">  
        <input id="messageInput" placeholder="Write a message..." maxlength="2000" autocomplete="off">  
        <button id="sendButton" type="submit">Send</button>  
      </div>  
    </form>
