<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e54">
<title>Where We Belong</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#e9edef;color:#111b21}
button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.login-card{background:white;width:100%;max-width:380px;padding:28px;border-radius:15px;text-align:center;box-shadow:0 4px 20px #0001}
.login-card h1{color:#075e54;font-size:27px}
.login-card p{color:#667781}
.field{width:100%;padding:13px;border:1px solid #d1d7db;border-radius:8px;margin:7px 0;outline-color:#128c7e}
.primary{background:#075e54;color:white;border:0;border-radius:8px;padding:13px;width:100%;margin-top:10px}
#error{color:#c62828;font-size:13px;overflow-wrap:anywhere}
#app{height:100dvh;max-width:850px;margin:auto;background:#efeae2;display:flex;flex-direction:column}
header{height:68px;background:#075e54;color:white;display:flex;align-items:center;padding:0 15px;gap:12px;flex-shrink:0}
.avatar{height:43px;width:43px;border-radius:50%;background:#d9fdd3;color:#075e54;display:grid;place-items:center;font-size:23px}
.headtext{flex:1}
.headtext strong{display:block;font-size:17px}
#status{font-size:12px;margin-top:4px;color:#d6f5eb}
#logout{background:transparent;color:white;border:1px solid #ffffff66;border-radius:7px;padding:7px}
#messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px;background-color:#efeae2;background-image:radial-gradient(#d9d0c4 0.6px,transparent 0.6px);background-size:12px 12px}
.bubble{max-width:82%;min-width:90px;padding:9px 11px 6px;border-radius:9px;box-shadow:0 1px 1px #0001;overflow-wrap:anywhere;white-space:pre-wrap}
.mine{align-self:flex-end;background:#d9fdd3;border-top-right-radius:2px}
.theirs{align-self:flex-start;background:white;border-top-left-radius:2px}
.sender{font-size:11px;color:#087e70;margin-bottom:4px;font-weight:bold}
.time{text-align:right;font-size:10px;color:#667781;margin-top:5px}
#typing{min-height:20px;font-size:12px;color:#667781;padding:0 15px;background:#f0f2f5}
#composer{display:flex;align-items:flex-end;gap:8px;padding:10px;background:#f0f2f5}
#message{flex:1;min-width:0;max-height:120px;resize:none;border:0;border-radius:22px;padding:12px 15px;outline-color:#128c7e}
#send{width:44px;height:44px;border:0;border-radius:50%;background:#075e54;color:white;font-size:20px}
#notice{padding:8px 12px;text-align:center;font-size:12px;color:#667781;background:#fff}
@media(min-width:600px){body{padding:15px 0}#app{height:calc(100dvh - 30px);border-radius:8px;overflow:hidden;box-shadow:0 2px 12px #0002}}
</style>
</head>
<body>
<section id="login">
  <div class="login-card">
    <div style="font-size:42px">💬</div>
    <h1>Where We Belong</h1>
    <p>A little place for just us.</p>
    <form id="loginForm">
      <input class="field" id="email" type="email" placeholder="Email address" required autocomplete="username">
      <input class="field" id="password" type="password" placeholder="Password" required autocomplete="current-password">
      <button class="primary" type="submit">Log in</button>
    </form>
    <p id="error"></p>
  </div>
</section>
<main id="app" class="hidden">
  <header>
    <div class="avatar">♡</div>
    <div class="headtext">
      <strong>Where We Belong</strong>
      <div id="status">Connecting…</div>
    </div>
    <button id="logout">Log out</button>
  </header>
  <div id="notice">Just us, in our own little world ♡</div>
  <section id="messages" aria-live="polite"></section>
  <div id="typing"></div>
  <form id="composer">
    <textarea id="message" rows="1" placeholder="Message" aria-label="Message"></textarea>
    <button id="send" type="submit" aria-label="Send">➤</button>
  </form>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, push, set, onChildAdded, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpa8Mr_4qdt7ETUtiI0wZDS0OW-EZ1884",
  authDomain: "where-we-belong-b25b1.firebaseapp.com",
  databaseURL: "https://where-we-belong-b25b1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "where-we-belong-b25b1",
  storageBucket: "where-we-belong-b25b1.firebasestorage.app",
  messagingSenderId: "803513103263",
  appId: "1:803513103263:web:4252a04ddbbd6d1ac1c3aa",
  measurementId: "G-5QSSTNZQ7H"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getDatabase(appFirebase);
const $ = id => document.getElementById(id);
let currentUser = null;
let stopMessages = null, stopTyping = null, stopPresence = null;
let typingTimeout;

function showError(message) { $("error").textContent = message; }
function cleanListeners() {
  if (stopMessages) stopMessages();
  if (stopTyping) stopTyping();
  if (stopPresence) stopPresence();
  stopMessages = stopTyping = stopPresence = null;
}
function showTime(timestamp) {
  if (!timestamp) return "";
  return new Date(timestamp).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}
function addMessage(key, data) {
  if (!data || typeof data.text !== "string") return;
  const box = document.createElement("article");
  box.className = "bubble " + (data.uid === currentUser.uid ? "mine" : "theirs");
  box.dataset.key = key;
  if (data.uid !== currentUser.uid) {
    const sender = document.createElement("div");
    sender.className = "sender";
    sender.textContent = data.sender || "You";
    box.appendChild(sender);
  }
  const content = document.createElement("div");
  content.textContent = data.text;
  box.appendChild(content);
  const time = document.createElement("div");
  time.className = "time";
  time.textContent = showTime(data.timestamp);
  box.appendChild(time);
  $("messages").appendChild(box);
  $("messages").scrollTop = $("messages").scrollHeight;
}
function startChat(user) {
  cleanListeners();
  currentUser = user;
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("status").textContent = "Connected";
  $("messages").replaceChildren();

  stopMessages = onChildAdded(ref(db, "messages"), snapshot => {
    addMessage(snapshot.key, snapshot.val());
  }, error => {
    $("status").textContent = "Could not load messages";
    console.error(error);
  });

  const myPresence = ref(db, "presence/" + user.uid);
  set(myPresence, {online:true, lastChanged:serverTimestamp()})
    .then(() => onDisconnect(myPresence).set({online:false, lastChanged:serverTimestamp()}))
    .catch(console.error);

  stopPresence = onValue(ref(db, "presence"), snapshot => {
    const users = snapshot.val() || {};
    const others = Object.entries(users).filter(([uid, value]) => uid !== user.uid && value && value.online);
    $("status").textContent = others.length ? "Online" : "Where We Belong";
  });

  stopTyping = onValue(ref(db, "typing"), snapshot => {
    const users = snapshot.val() || {};
    const typingUser = Object.entries(users).some(([uid, value]) => uid !== user.uid && value === true);
    $("typing").textContent = typingUser ? "Typing…" : "";
  });
}
$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  showError("");
  const button = $("loginForm").querySelector("button");
  button.disabled = true;
  button.textContent = "Logging in…";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (error) {
    showError(error.code + ": " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Log in";
  }
});
onAuthStateChanged(auth, user => {
  if (user) startChat(user);
  else {
    cleanListeners();
    currentUser = null;
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
  }
});
$("composer").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser) return;
  const input = $("message");
  const text = input.value.trim();
  if (!text) return;
  $("send").disabled = true;
  try {
    const newMessage = push(ref(db, "messages"));
    await set(newMessage, {uid:currentUser.uid, sender:currentUser.email || "Us", text, timestamp:serverTimestamp()});
    input.value = "";
    await set(ref(db, "typing/" + currentUser.uid), false);
  } catch (error) {
    $("typing").textContent = "Message not sent: " + error.message;
  } finally {
    $("send").disabled = false;
    input.focus();
  }
});
$("message").addEventListener("input", () => {
  if (!currentUser) return;
  set(ref(db, "typing/" + currentUser.uid), $("message").value.length > 0).catch(console.error);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    if (currentUser) set(ref(db, "typing/" + currentUser.uid), false).catch(console.error);
  }, 1800);
});
$("logout").addEventListener("click", async () => {
  if (currentUser) {
    await set(ref(db, "typing/" + currentUser.uid), false).catch(() => {});
    await set(ref(db, "presence/" + currentUser.uid), {online:false, lastChanged:serverTimestamp()}).catch(() => {});
  }
  await signOut(auth);
});
$("message").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});
</script>
</body>
</html>
